name: Keep Streamlit Alive

on:
  schedule:
    # Runs every 2 hours (0:00, 2:00, 4:00, etc. UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping to Streamlit App
        run: |
          curl -s -L -A "Mozilla/5.0" -o /dev/null -w "HTTP Response: %{http_code}\n" https://pharmacoscribe.streamlit.app/
